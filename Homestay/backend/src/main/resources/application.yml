spring:
  application:
    name: tourism-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 演示默认账号: 请按本机 MySQL 实际账号密码修改;初始化见 backend/sql/schema.sql
    url: jdbc:mysql://localhost:3306/tourism_homestay?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: '123456'
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  mapper-locations: classpath*:mapper/**/*.xml

# 自定义配置
tourism:
  jwt:
    # 演示密钥(正式环境应使用更长随机密钥)
    secret: tourism-homestay-graduation-project-jwt-secret-key-2026
    expire-hours: 24
  upload:
    # 图片上传本地目录(相对项目根或绝对路径,均自动创建)
    dir: ./uploads
    # 外链图床是否作为初始化数据的兜底来源;若关闭将仅显示本地上传/占位图
    remote-images-enabled: true

logging:
  level:
    com.tourism: debug
