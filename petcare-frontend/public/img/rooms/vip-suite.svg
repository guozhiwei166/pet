  <rect y="200" width="400" height="60" fill="#5B4A70"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#8A75A8" stroke-width="6"/>
  <!-- 壁灯×2 -->
  <circle cx="56" cy="120" r="12" fill="#F4DFA0"/>
  <path d="M44 124 l-6 26 h24 l-6 -26" fill="#D8C088"/>
  <circle cx="344" cy="120" r="12" fill="#F4DFA0"/>
  <path d="M332 124 l-6 26 h24 l-6 -26" fill="#D8C088"/>
