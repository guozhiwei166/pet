  <!-- 皇冠狗 -->
  <circle cx="140" cy="98" r="22" fill="#E8C396"/>
  <circle cx="140" cy="72" r="16" fill="#E8C396"/>
  <path d="M122 66 l-10 -20 l10 8 l18 -12 l18 12 l10 -8 l-10 20 z" fill="#F2C94C"/>
  <circle cx="124" cy="84" r="2" fill="#D4A05A"/>
  <circle cx="156" cy="84" r="2" fill="#D4A05A"/>
  <circle cx="134" cy="76" r="2.2" fill="#333"/>
  <circle cx="146" cy="76" r="2.2" fill="#333"/>
