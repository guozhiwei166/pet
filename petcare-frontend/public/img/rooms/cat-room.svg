<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <!-- 猫咪专属房：薄荷绿 + 猫爬架 + 猫砂盆 + 猫抓板，猫咪元素 -->
  <rect width="400" height="260" rx="14" fill="#E4F2EC"/>
  <rect y="206" width="400" height="54" fill="#B8D9C8"/>
  <!-- 猫爬架（树干+平台） -->
  <rect x="52" y="80" width="26" height="126" rx="12" fill="#C08C5A"/>
  <rect x="36" y="196" width="58" height="12" rx="6" fill="#A87648"/>
  <ellipse cx="65" cy="80" rx="46" ry="12" fill="#8FBFA5"/>
  <ellipse cx="105" cy="68" rx="36" ry="10" fill="#7FB095"/>
  <!-- 平台上的猫 -->
  <ellipse cx="65" cy="56" rx="20" ry="13" fill="#F0A868"/>
  <circle cx="65" cy="38" r="12" fill="#F0A868"/>
  <path d="M56 30 l-4 -12 l9 6 z" fill="#F0A868"/>
  <path d="M74 30 l4 -12 l-9 6 z" fill="#F0A868"/>
  <circle cx="60" cy="36" r="1.8" fill="#5A3A20"/>
  <circle cx="70" cy="36" r="1.8" fill="#5A3A20"/>
  <path d="M63 42 q2 2 4 0" stroke="#5A3A20" stroke-width="1.3" fill="none"/>
  <path d="M45 52 q-12 -4 -16 -16 q10 0 16 8" fill="#F0A868"/>
  <path d="M85 52 q12 -4 16 -16 q-10 0 -16 8" fill="#F0A868"/>
  <!-- 毛线球 -->
  <circle cx="170" cy="212" r="18" fill="#F48FB1"/>
  <circle cx="176" cy="208" r="12" fill="#F06292"/>
  <path d="M156 206 q-14 -10 -8 -22 q16 2 14 16" stroke="#F48FB1" stroke-width="2.4" fill="none"/>
  <!-- 猫碗 -->
  <ellipse cx="300" cy="210" rx="30" ry="9" fill="#A5C9F0"/>
  <path d="M270 210 v12 a30 9 0 0 0 60 0 v-12" fill="#8FB8E4"/>
  <!-- 猫抓板(柱) -->
  <rect x="230" y="150" width="18" height="56" rx="6" fill="#CBB28C"/>
  <ellipse cx="239" cy="148" rx="14" ry="7" fill="#B99E72"/>
  <!-- 鱼形玩具 -->
  <ellipse cx="330" cy="160" rx="14" ry="8" fill="#F4A6A6" transform="rotate(-14 330 160)"/>
  <path d="M344 158 l10 -6 l-6 8 l6 8 l-10 -6" fill="#F4A6A6"/>
  <circle cx="320" cy="158" r="1.6" fill="#5A3A20"/>
</svg>
