<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <!-- 豪华房：雾蓝墙 + 落地窗 + 吊灯 + 软垫床，空间宽敞明亮 -->
  <rect width="400" height="260" rx="14" fill="#E9F0F5"/>
  <rect y="204" width="400" height="56" fill="#B9C6CE"/>
  <!-- 落地窗 -->
  <rect x="240" y="34" width="120" height="150" rx="6" fill="#DFF0FA" stroke="#fff" stroke-width="7"/>
  <line x1="300" y1="34" x2="300" y2="184" stroke="#fff" stroke-width="5"/>
  <line x1="240" y1="108" x2="360" y2="108" stroke="#fff" stroke-width="5"/>
  <!-- 窗帘 -->
  <path d="M232 34 q-14 60 -4 150 h-10 v-150 z" fill="#A9C7DE"/>
  <path d="M368 34 q14 60 4 150 h10 v-150 z" fill="#A9C7DE"/>
  <!-- 吊灯 -->
  <line x1="140" y1="0" x2="140" y2="30" stroke="#C9A96A" stroke-width="3"/>
  <path d="M120 46 a24 20 0 0 0 40 0 z" fill="#F4DFA0"/>
  <circle cx="140" cy="46" r="5" fill="#F9E9B8"/>
  <!-- 宠物床 -->
  <ellipse cx="140" cy="192" rx="92" ry="24" fill="#D8B48F"/>
  <path d="M48 192 a92 52 0 0 1 184 0 z" fill="#C29E76"/>
  <ellipse cx="140" cy="192" rx="64" ry="15" fill="#A9855E"/>
  <rect x="60" y="176" width="160" height="10" rx="5" fill="#D9C4A8" opacity=".9"/>
  <!-- 猫形宠物 -->
  <circle cx="176" cy="128" r="20" fill="#8D9AA6"/>
  <path d="M162 112 l-6 -18 l12 8 z" fill="#8D9AA6"/>
  <path d="M190 112 l6 -18 l-12 8 z" fill="#8D9AA6"/>
  <circle cx="180" cy="130" r="2.2" fill="#2E3B45"/>
  <!-- 射灯 -->
  <circle cx="52" cy="30" r="6" fill="#F4DFA0"/>
  <circle cx="220" cy="30" r="6" fill="#F4DFA0"/>
</svg>
