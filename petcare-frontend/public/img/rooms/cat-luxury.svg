<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <!-- 猫·豪华房：落地窗+观景台+攀爬墙+吊灯，明亮开阔 -->
  <rect width="400" height="260" rx="14" fill="#F6ECF2"/>
  <rect y="204" width="400" height="56" fill="#CDB4C9"/>
  <!-- 落地窗 -->
  <rect x="236" y="34" width="126" height="150" rx="6" fill="#DFF0FA" stroke="#fff" stroke-width="7"/>
  <line x1="299" y1="34" x2="299" y2="184" stroke="#fff" stroke-width="5"/>
  <path d="M228 34 q-14 60 -4 150 h-10 v-150 z" fill="#DEC6E2"/>
  <path d="M370 34 q14 60 4 150 h10 v-150 z" fill="#DEC6E2"/>
  <!-- 吊灯 -->
  <line x1="130" y1="0" x2="130" y2="30" stroke="#C9A96A" stroke-width="3"/>
  <path d="M112 46 a22 18 0 0 0 36 0 z" fill="#F4DFA0"/>
  <!-- 攀爬墙搁板 -->
  <rect x="40" y="120" width="70" height="10" rx="5" fill="#B99E72"/>
  <rect x="52" y="168" width="56" height="10" rx="5" fill="#B99E72"/>
  <rect x="44" y="120" width="8" height="48" fill="#C08C5A"/>
  <rect x="100" y="168" width="8" height="36" fill="#C08C5A"/>
  <!-- 猫在搁板 -->
  <ellipse cx="86" cy="112" rx="16" ry="10" fill="#D9A05B"/>
  <circle cx="86" cy="93" r="10" fill="#D9A05B"/>
  <path d="M78 86 l-3 -10 l8 5 z" fill="#D9A05B"/>
  <path d="M94 86 l3 -10 l-8 5 z" fill="#D9A05B"/>
  <!-- 豪华猫窝 -->
  <ellipse cx="130" cy="196" rx="80" ry="18" fill="#C9B8DE"/>
  <path d="M50 196 a80 42 0 0 1 160 0 z" fill="#B39FD1"/>
  <ellipse cx="130" cy="196" rx="50" ry="10" fill="#9C86C0"/>
  <!-- 鱼玩具 -->
  <ellipse cx="200" cy="110" rx="13" ry="7" fill="#F4A6A6" transform="rotate(-12 200 110)"/>
</svg>
