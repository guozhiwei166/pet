server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/petcare?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "123456"
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000
  sql:
    # 正式/持久模式：不再每次启动重建表。如需恢复演示数据，用 demo profile 启动一次：
    #   mvn spring-boot:run -Dspring-boot.run.profiles=demo   （自动建表+重灌种子后自动切回）
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

petcare:
  jwt:
    secret: petcare-jwt-secret-2026
    expire-hours: 24
  upload:
    dir: upload
    max-size: 5MB

logging:
  level:
    com.petcare: info
